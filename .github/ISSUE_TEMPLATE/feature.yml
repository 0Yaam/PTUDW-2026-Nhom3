name: Feature task
description: One complete feature with a clear result
title: ""
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the result in one or two sentences.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner and reviewer
      placeholder: "Owner: Hieu; Reviewer: Dan"
    validations:
      required: true
  - type: input
    id: srs
    attributes:
      label: SRS codes
      placeholder: FR-RCP-003
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the database, API, UI, and test work that applies.
      placeholder: |
        - Database:
        - API:
        - UI:
        - Tests:
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Say what is needed to start and what is needed to finish integration.
      placeholder: |
        Start: None.
        Finish integration: Issue #1.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - S
        - M
        - L
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The main flow works with real data.
        - [ ] Important errors are handled.
        - [ ] Tests cover important success and error cases.
        - [ ] The related UI and API work together when both apply.
    validations:
      required: true
